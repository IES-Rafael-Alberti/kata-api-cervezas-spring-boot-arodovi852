version: "3.8"
services:

  db:
    image: mysql:8.0
    container_name: beer-api-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: kata-api
    volumes:
      - ./initSQL:/docker-entrypoint-initdb.d
      - mysql_data:/var/lib/mysql
    ports:
      - "3306:3306"
    networks:
      - beer-api-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      timeout: 20s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: beer-api-app
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/kata-api?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
    networks:
      - beer-api-network
    depends_on:
      db:
        condition: service_healthy
    restart: on-failure

  adminer:
    image: adminer
    container_name: beer-api-adminer
    ports:
      - "8888:8080"
    networks:
      - beer-api-network
    depends_on:
      - db

volumes:
  mysql_data:

networks:
  beer-api-network:
    driver: bridge